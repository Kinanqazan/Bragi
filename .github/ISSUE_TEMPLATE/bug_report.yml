name: Bug Report
description: Before opening a new issue, please search to see if an issue already exists for the bug you encountered.
title: "[Bug]: "
labels: ["bug", "triage"]
#assignees:
#  - deluan
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for taking the time to fill out this bug report!
  - type: checkboxes
    id: requirements
    attributes:
      label: "I confirm that:"
      options:
        - label: I have searched the existing [open and closed issues](https://github.com/Kinanqaz/Bragi/issues?q=is%3Aissue) to see if this bug has already been reported
          required: true
        - label: I'm using the latest version (your issue may have been fixed already)
          required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: What Bragi version are you running? Please try the latest version first.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current Behavior
      description: A concise description of what you're experiencing.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this scenario...
        2. With this config...
        3. Click (or Execute) '...'
        4. See error...
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        examples:
          - **OS**: Ubuntu 20.04
          - **Browser**: Chrome 110.0.5481.177 on Windows 11
          - **Client**: Bragi web app or Android app
      value: |
        - OS:
        - Browser:
        - Client:
      render: markdown
  - type: dropdown
    id: distribution
    attributes:
      label: How is Bragi installed?
      multiple: false
      options:
        - Docker
        - Binary built from source
        - Running from a source checkout
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Share the relevant Bragi settings, BR_ environment variables, or Docker Compose service. Remove passwords and other secrets.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please include relevant Bragi log output. Set `BR_LOGLEVEL=debug` if more detail is needed, and remove secrets before posting.
      render: shell
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach screenshots by clicking this area to highlight it and then dragging files in.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow Bragi's [Code of Conduct](https://github.com/Kinanqaz/Bragi/blob/master/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow Bragi's Code of Conduct
          required: true
