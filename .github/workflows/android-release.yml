name: Publish Android APK

on:
  push:
    branches:
      - master
    paths:
      - android/bragi.apk

permissions:
  contents: write

jobs:
  publish:
    name: Publish existing APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          latest_tag="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          if [[ "$latest_tag" =~ ^android-v1\.([0-9]+)$ ]]; then
            previous_minor="${BASH_REMATCH[1]}"
          elif [[ "$latest_tag" =~ ^android-([0-9]+)$ ]]; then
            previous_minor="${BASH_REMATCH[1]}"
          else
            previous_minor=0
          fi

          next_minor=$((previous_minor + 1))
          release_tag="android-v1.${next_minor}"
          release_title="Bragi Android v1.${next_minor}"

          gh release create "$release_tag" android/bragi.apk \
            --title "$release_title" \
            --notes "Bragi for Android. Install this APK on an Android device, connect it to your Bragi server, and stream your music library with native media controls and Google Cast support." \
            --target "$COMMIT_SHA" \
            --latest
