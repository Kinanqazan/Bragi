name: Build custom Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Cache Go build and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-cache-

      - name: Build Navidrome binary (dynamic musl)
        run: |
          mkdir -p "$HOME/.cache/go-build" "$HOME/go/pkg/mod" out
          docker run --rm -i \
            -v "${{ github.workspace }}:/workspace" \
            -v "$HOME/.cache/go-build:/root/.cache/go-build" \
            -v "$HOME/go/pkg/mod:/go/pkg/mod" \
            -w /workspace \
            public.ecr.aws/docker/library/golang:1.26-alpine \
            sh << 'EOF'
          set -e
          apk add --no-cache clang lld file git gcc musl-dev zlib-dev
          git config --global --add safe.directory '*'
          export CGO_ENABLED=1
          BUILD_TAGS=$(./release/build-tags.sh)
          go build -buildvcs=false -tags="${BUILD_TAGS}" -ldflags="-w -s \
            -linkmode=external -extldflags '-latomic' \
            -X github.com/navidrome/navidrome/consts.gitSha=${{ github.sha }} \
            -X github.com/navidrome/navidrome/consts.gitTag=custom-${{ github.ref_name }}" \
            -o out/navidrome .
          ./release/verify-binary.sh out/navidrome
          file out/navidrome | grep -q "dynamically linked" || { echo "ERROR: out/navidrome is not dynamically linked"; file out/navidrome; exit 1; }
          chmod 755 out/navidrome
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Navidrome custom fork
            org.opencontainers.image.description=Navidrome with this fork's UI and media deletion customizations

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=gha,scope=custom-image-final
          cache-to: type=gha,mode=min,scope=custom-image-final
          provenance: false
          sbom: false
