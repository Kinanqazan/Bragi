<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121214" />
    <title>Bragi · Offline</title>
    <style>
      * { box-sizing: border-box; }
      :root { --accent: #90caf9; --accent-text: #101214; }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        place-items: center;
        background: radial-gradient(ellipse at 50% 40%, #202328 0, #121214 48%);
        color: #f5f3f8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(100%, 350px); text-align: center; animation: arrive .35s ease-out both; }
      .icon {
        display: grid;
        width: 104px;
        height: 104px;
        margin: 0 auto 28px;
        place-items: center;
        border: 1px solid #ffffff18;
        border-radius: 32px;
        background: linear-gradient(145deg, #25282d, #191a1d);
        box-shadow: 0 20px 55px #0005, inset 0 1px #ffffff15;
      }
      .icon img { width: 66px; height: 66px; object-fit: contain; }
      .eyebrow { margin: 0 0 11px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 8vw, 34px); font-weight: 650; letter-spacing: -.04em; line-height: 1.12; }
      .message { margin: 14px auto 25px; color: #aaa8b5; font-size: 15px; line-height: 1.6; }
      .actions { display: flex; justify-content: center; gap: 10px; }
      button {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        padding: 0 16px;
        border-radius: 15px;
        border: 1px solid transparent;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary { border-color: #ffffff24; background: #ffffff08; color: #f5f3f8; }
      button:focus-visible { outline: 3px solid #f5f3f8; outline-offset: 3px; }
      .hint { margin: 18px 0 0; color: #777784; font-size: 12px; }
      @keyframes arrive { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="icon" aria-hidden="true">
        <img src="./bragi-logo-mask.png" alt="" />
      </div>
      <p class="eyebrow">Bragi · taking a little break</p>
      <h1 id="title">Your music is<br />out of reach</h1>
      <p class="message">Bragi can’t reach your server right now. Check your connection, then try again.</p>
      <div class="actions">
        <button type="button" onclick="window.BragiNative ? window.location.replace('./index.html') : window.location.reload()">Try again</button>
        <button id="change-server" class="secondary" type="button" hidden onclick="window.BragiNative?.changeServer?.()">Change server</button>
      </div>
      <p class="hint">Using Tailscale? Check that it’s connected.</p>
    </main>
    <script>
      const changeServerButton = document.getElementById('change-server')
      if (window.BragiNative?.changeServer) {
        changeServerButton.hidden = false
        try {
          const accent = window.BragiNative.getThemeAccentColor?.()
          if (/^#[\da-f]{6}$/i.test(accent || '')) {
            document.documentElement.style.setProperty('--accent', accent)
            const rgb = accent.match(/[\da-f]{2}/gi).map((value) => parseInt(value, 16))
            const luminance = rgb
              .map((channel) => channel / 255)
              .map((channel) => channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4)
              .reduce((sum, channel, index) => sum + channel * [0.2126, 0.7152, 0.0722][index], 0)
            document.documentElement.style.setProperty('--accent-text', luminance > 0.179 ? '#101214' : '#ffffff')
          }
        } catch (_) {}
      } else {
        changeServerButton.hidden = true
      }
    </script>
  </body>
</html>
